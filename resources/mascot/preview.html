<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CODEX mascot</title>
    <link rel="stylesheet" href="mascot.css" />
    <style>
        body { margin: 0; padding: 24px; background: #222; color: #ddd; font: 14px sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, 180px); gap: 20px; }
        .card { text-align: center; }
        .card svg { width: 160px; height: 160px; }
        .card button { margin-top: 6px; }
    </style>
</head>

<body>
    <div class="grid" id="grid"></div>
    <script>
        // The markup to copy into the UI; each copy needs its own mask id.
        function mascotMarkup(id, state) {
            return `<svg class="mascot" data-state="${state}" viewBox="0 0 64 64" role="img" aria-label="CODEX">
    <title>CODEX</title>
    <mask id="${id}-cut">
        <rect width="64" height="64" fill="#fff" />
        <g class="head" fill="#000">
            <rect x="18" y="27" width="28" height="20" rx="6" />
            <rect x="13.5" y="33" width="5" height="8" rx="2" />
            <rect x="45.5" y="33" width="5" height="8" rx="2" />
            <rect x="30.5" y="21" width="3" height="7" />
            <circle class="antenna-ball" cx="32" cy="19.5" r="3" />
        </g>
        <g fill="none" stroke="#000" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
            <g transform="translate(46 24)"><path class="zzz" d="M0 0H3.6L0 4.6H3.6" /></g>
            <g class="zzz-small" transform="translate(49.5 20) scale(0.7)"><path class="zzz" d="M0 0H3.6L0 4.6H3.6" /></g>
        </g>
    </mask>
    <path fill="#0088ff" mask="url(#${id}-cut)" d="M63 32 47.5 58.847 16.5 58.847 1 32 16.5 5.153 47.5 5.153Z" />
    <g class="head" fill="#0088ff">
        <g class="eye-left" transform="translate(26 34.5)"><g class="eye-look"><path class="eye-shape" fill="#0088ff" stroke="#0088ff" stroke-width="1.1" stroke-linejoin="round" d="M-2.25 0C-2.25 -3 2.25 -3 2.25 0C2.25 3 -2.25 3 -2.25 0Z" /></g></g>
        <g class="eye-right" transform="translate(38 34.5)"><g class="eye-look"><path class="eye-shape" fill="#0088ff" stroke="#0088ff" stroke-width="1.1" stroke-linejoin="round" d="M-2.25 0C-2.25 -3 2.25 -3 2.25 0C2.25 3 -2.25 3 -2.25 0Z" /></g></g>
        <path class="mouth" fill="none" stroke="#0088ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M26.5 40.8C27.17 41.73 28.33 42.2 30 42.2C32.5 42.2 35 42.2 37.5 42.2" />
    </g>
</svg>`;
        }

        const states = ['calm', 'thinking', 'curious', 'happy', 'sad', 'asleep', 'worried', 'excited', 'focused', 'startled', 'waking'];
        const grid = document.getElementById('grid');
        states.forEach((state) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = mascotMarkup('m-' + state, state) + `<div>${state}</div><button>replay</button>`;
            card.querySelector('button').onclick = () => {
                const svg = card.querySelector('svg');
                svg.removeAttribute('data-state');
                void svg.getBoundingClientRect();
                svg.setAttribute('data-state', state);
            };
            grid.appendChild(card);
        });

        // ?t=<milliseconds> freezes every animation at that time, for stills.
        const frozen_at = new URLSearchParams(location.search).get('t');
        if (frozen_at !== null) {
            requestAnimationFrame(() => document.getAnimations().forEach((animation) => {
                animation.pause();
                animation.currentTime = Number(frozen_at);
            }));
        }
    </script>
</body>

</html>
