<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CODEX Electron</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --panel: #111827;
            --panel-alt: #1f2937;
            --line: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #111827, var(--bg));
            color: var(--text);
            font: 15px/1.5 'Segoe UI', sans-serif;
        }

        .shell {
            width: min(980px, calc(100vw - 48px));
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
            background: rgba(17, 24, 39, 0.9);
            box-shadow: 0 30px 90px rgba(15, 23, 42, 0.7);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
            background: rgba(15, 23, 42, 0.8);
        }

        .brand {
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 12px;
            color: var(--muted);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.32);
            border-radius: 999px;
            padding: 8px 14px;
            color: #bae6fd;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
        }

        .content {
            padding: 26px 24px 30px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        p {
            margin: 0;
            color: var(--muted);
        }

        pre {
            margin-top: 20px;
            padding: 18px 20px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(15, 23, 42, 0.8);
            color: #dbeafe;
            overflow: auto;
        }
    </style>
</head>

<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">CODEX Electron</div>
            <div class="status"><span class="dot"></span> ready</div>
        </header>
        <section class="content">
            <h1>Desktop shell bootstrapped</h1>
            <p>
                This renderer is intentionally lightweight while the TypeScript daemon bridge is being staged behind it.
            </p>
            <pre>{
  "protocol": "JSON line daemon",
  "backend": "Python CODEX daemon (compat layer)",
  "frontend": "Electron renderer shell"
}</pre>
        </section>
    </main>
</body>

</html>
